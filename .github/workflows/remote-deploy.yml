name: Remote Deploy to Windows VPS
on:
  push:
    branches:
      - main
    # Deploy backend/VPS changes automatically; frontend-only changes stay on Vercel.
    paths:
      - 'server/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '*.sql'
      - 'supabase_*.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zolos-remote-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request VPS deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ vars.ZOLOS_DEPLOY_WEBHOOK_URL || secrets.ZOLOS_DEPLOY_WEBHOOK_URL }}
