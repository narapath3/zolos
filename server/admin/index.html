<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ZOLOS · แผงควบคุมระบบ</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#111827; --panel2:#0e1626; --line:#1e2b41;
    --txt:#e2e8f0; --muted:#8aa0bd; --accent:#4aa3ff; --good:#37d67a;
    --warn:#ffb020; --bad:#ff5470; --chip:#16233a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,'Segoe UI',sans-serif;font-size:14px}
  a{color:var(--accent)}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:#04101f;border:none;border-radius:8px;padding:9px 16px;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.bad{background:var(--bad);color:#fff}
  .btn.warn{background:var(--warn);color:#04101f}
  .btn.sm{padding:5px 10px;font-size:12px;font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}
  #login h1{margin:0 0 4px;font-size:22px}
  #login p{margin:0 0 22px;color:var(--muted);font-size:13px}
  #login label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  #login input{width:100%}
  #login .btn{width:100%;margin-top:20px;padding:11px}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

  /* app shell */
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .logo{font-weight:800;font-size:17px;color:var(--accent);letter-spacing:.5px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;border:none;color:var(--muted);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
  nav button.active{background:var(--chip);color:var(--txt)}
  header .spacer{flex:1}
  header .who{color:var(--muted);font-size:13px}
  main{padding:20px;max-width:1280px;margin:0 auto}

  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .k{color:var(--muted);font-size:12px;margin-bottom:6px}
  .stat .v{font-size:24px;font-weight:800}
  .stat .v.small{font-size:18px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .panel h2{margin:0 0 12px;font-size:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px}
  tbody tr:hover{background:var(--panel2)}
  .clickable{cursor:pointer}
  .tablewrap{overflow-x:auto}

  .chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--chip)}
  .chip.on{background:rgba(55,214,122,.15);color:var(--good)}
  .chip.off{background:rgba(138,160,189,.12);color:var(--muted)}
  .chip.admin{background:rgba(74,163,255,.18);color:var(--accent)}
  .num{font-variant-numeric:tabular-nums}
  .gold{color:var(--warn)}
  .zol{color:#c98bff}

  .threat-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
  .threat-bar>i{display:block;height:100%}

  /* modal */
  #modal{position:fixed;inset:0;background:rgba(4,8,16,.7);display:flex;align-items:flex-start;justify-content:center;padding:24px;z-index:50;overflow:auto}
  #modal .box{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  #modal h2{margin:0}
  .modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .modal-head .spacer{flex:1}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .fld>span{color:var(--muted)}
  .fld input,.fld select{width:100%}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:middle}
  .pill.bad{background:var(--bad);color:#fff}
  .close{background:transparent;border:none;color:var(--muted);font-size:22px;line-height:1}
  .edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .edit-grid label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .edit-grid input{width:100%}
  .subhead{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 20px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,'Cascadia Code',monospace}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card">
    <h1>🛡️ ZOLOS Admin</h1>
    <p>แผงควบคุมระบบเกม — เฉพาะผู้ดูแล</p>
    <label>อีเมลผู้ดูแล</label>
    <input id="l-email" type="email" autocomplete="username" placeholder="admin@email.com">
    <label>รหัสผ่าน</label>
    <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn" id="l-btn">เข้าสู่ระบบ</button>
    <div class="err" id="l-err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <span class="logo">🛡️ ZOLOS</span>
    <nav>
      <button data-tab="dash" class="active">ภาพรวม</button>
      <button data-tab="players">ผู้เล่น</button>
      <button data-tab="movement">📈 การเปลี่ยนแปลง</button>
      <button data-tab="monsters">👹 มอนสเตอร์</button>
      <button data-tab="economy">เศรษฐกิจ</button>
      <button data-tab="security">ความปลอดภัย</button>
      <button data-tab="events">กิจกรรม</button>
    </nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost sm" id="logout">ออก</button>
  </header>
  <main id="view"></main>
</div>

<div id="modal" class="hidden"></div>

<script>
const API='/api', ADMIN='/admin/api', TK='zolos_admin_jwt';
let token=localStorage.getItem(TK)||null;
let me=null;
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const fmt=(n)=>Number(n||0).toLocaleString('en-US');
const ago=(ts)=>{if(!ts)return'-';const s=(Date.now()-ts)/1000;if(s<60)return Math.floor(s)+'วิ';if(s<3600)return Math.floor(s/60)+'น';if(s<86400)return Math.floor(s/3600)+'ชม';return Math.floor(s/86400)+'ว';};
function toast(msg,ok=true){const t=el(`<div class="toast ${ok?'good':'bad'}">${msg}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

async function api(path,opts={},base=ADMIN){
  const h={'Content-Type':'application/json',...(opts.headers||{})};
  if(token)h.Authorization='Bearer '+token;
  const res=await fetch(base+path,{...opts,headers:h});
  let body=null;try{body=await res.json()}catch{}
  if(!res.ok)throw new Error((body&&body.error)||('HTTP '+res.status));
  return body;
}

// ---------- LOGIN ----------
$('#l-btn').onclick=doLogin;
$('#l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){
  const email=$('#l-email').value.trim(), password=$('#l-pass').value;
  $('#l-err').textContent='';
  if(!email||!password){$('#l-err').textContent='กรอกอีเมลและรหัสผ่าน';return;}
  $('#l-btn').disabled=true;$('#l-btn').textContent='กำลังเข้าสู่ระบบ...';
  try{
    const r=await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})},API);
    token=r.token;
    const chk=await api('/me',{},ADMIN); // verifies is_admin
    me=chk.admin;localStorage.setItem(TK,token);
    enterApp();
  }catch(e){
    token=null;localStorage.removeItem(TK);
    $('#l-err').textContent = /ผู้ดูแล/.test(e.message)?'บัญชีนี้ไม่ใช่ผู้ดูแลระบบ':('เข้าสู่ระบบไม่สำเร็จ: '+e.message);
  }finally{$('#l-btn').disabled=false;$('#l-btn').textContent='เข้าสู่ระบบ';}
}

function enterApp(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#who').textContent='👤 '+(me?.username||'admin');
  go('dash');
}
$('#logout').onclick=()=>{token=null;me=null;localStorage.removeItem(TK);location.reload();};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));

let cur='dash';
function go(tab){
  cur=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  ({dash:renderDash,players:renderPlayers,movement:renderMovement,monsters:renderMonsters,economy:renderEconomy,security:renderSecurity,events:renderEvents}[tab])();
}

// ---------- DASHBOARD ----------
async function renderDash(){
  const v=$('#view');v.innerHTML='<div class="muted">กำลังโหลด...</div>';
  try{
    const s=await api('/summary');
    v.innerHTML=`
      <div class="grid cards">
        ${stat('ผู้เล่นทั้งหมด',fmt(s.players))}
        ${stat('ตัวละคร',fmt(s.characters))}
        ${stat('ออนไลน์ตอนนี้',`<span style="color:var(--good)">${fmt(s.online)}</span>`)}
        ${stat('สมัครใหม่วันนี้',fmt(s.newCharsToday))}
        ${stat('เงินรวมในเกม',`<span class="gold">${fmt(s.totalGold)}</span>`,'small')}
        ${stat('ZOL รวม',`<span class="zol">${fmt(s.totalZol)}</span>`,'small')}
        ${stat('ประกาศขายตลาด',fmt(s.listings))}
        ${stat('เมลค้างส่ง',fmt(s.pendingMail))}
        ${stat('ผู้ดูแลระบบ',fmt(s.admins))}
      </div>
      <div class="panel" style="margin-top:16px">
        <h2>เข้าถึงด่วน</h2>
        <div class="row">
          <button class="btn ghost" onclick="go('players')">จัดการผู้เล่น</button>
          <button class="btn ghost" onclick="go('security')">ดู IP ผิดปกติ</button>
          <button class="btn ghost" onclick="go('events')">ส่งประกาศ / กิจกรรม</button>
        </div>
      </div>`;
  }catch(e){authGuard(e);v.innerHTML=`<div class="err">${e.message}</div>`;}
}
function stat(k,v,cls=''){return `<div class="stat"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;}

// ---------- PLAYERS ----------
let searchTimer=null;
async function renderPlayers(){
  const v=$('#view');
  v.innerHTML=`
    <div class="panel">
      <div class="row">
        <input id="p-search" placeholder="ค้นหาชื่อ / ID / อีเมล..." style="flex:1;min-width:200px">
        <button class="btn" id="p-go">ค้นหา</button>
      </div>
    </div>
    <div class="panel"><div class="tablewrap"><table>
      <thead><tr><th>ชื่อ</th><th>Lv</th><th>เงิน</th><th>ZOL</th><th>อาชีพ</th><th>สถานะ</th><th>อัปเดต</th></tr></thead>
      <tbody id="p-rows"><tr><td colspan="7" class="muted">กำลังโหลด...</td></tr></tbody>
    </table></div></div>`;
  const load=async()=>{
    const q=$('#p-search').value.trim();
    try{
      const {players}=await api('/players?limit=100&search='+encodeURIComponent(q));
      $('#p-rows').innerHTML = players.length? players.map(p=>`
        <tr class="clickable" onclick="openPlayer('${p.id}')">
          <td><b>${esc(p.name||'-')}</b> <span class="muted mono">${p.id.slice(0,10)}</span></td>
          <td class="num">${p.level}</td>
          <td class="num gold">${fmt(p.gold)}</td>
          <td class="num zol">${fmt(p.zol)}</td>
          <td>${esc(p.job||'-')}</td>
          <td>${p.online?'<span class="chip on">ออนไลน์</span>':'<span class="chip off">ออฟไลน์</span>'} ${p.is_admin?'<span class="chip admin">ADMIN</span>':''}</td>
          <td class="muted">${ago(p.updated_at?Date.parse(p.updated_at):0)}</td>
        </tr>`).join('') : '<tr><td colspan="7" class="muted">ไม่พบผู้เล่น</td></tr>';
    }catch(e){authGuard(e);$('#p-rows').innerHTML=`<tr><td colspan="7" class="err">${e.message}</td></tr>`;}
  };
  $('#p-go').onclick=load;
  $('#p-search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,350);});
  load();
}

window.openPlayer=async(cid)=>{
  const m=$('#modal');m.classList.remove('hidden');m.innerHTML='<div class="box"><div class="muted">กำลังโหลด...</div></div>';
  try{
    const d=await api('/players/'+encodeURIComponent(cid));
    const c=d.character;
    const numFields=['level','exp','gold','zol','hp','max_hp','sp','max_sp','atk','def','total_kills','play_time','mmr','pvp_wins','pvp_losses'];
    m.innerHTML=`<div class="box">
      <div class="modal-head">
        <h2>${esc(c.name||'-')}</h2>
        ${d.online?'<span class="chip on">ออนไลน์</span>':'<span class="chip off">ออฟไลน์</span>'}
        ${d.profile?.is_admin?'<span class="chip admin">ADMIN</span>':''}
        <span class="spacer"></span>
        <button class="close" onclick="closeModal()">×</button>
      </div>
      <div class="muted mono" style="font-size:12px;margin-bottom:6px">char: ${c.id} · user: ${c.user_id}</div>
      <div class="muted" style="font-size:12px;margin-bottom:14px">${esc(d.user?.email||'ไม่มีอีเมล (guest)')} · เข้าเกมล่าสุด ${d.user?.last_sign_in_at?ago(Date.parse(d.user.last_sign_in_at)):'-'}</div>

      <div class="subhead">แก้ไขค่าตัวละคร</div>
      <div class="edit-grid">
        ${numFields.map(f=>`<div><label>${f}</label><input data-f="${f}" class="num" value="${c[f]??0}"></div>`).join('')}
        <div><label>name</label><input data-f="name" value="${esc(c.name||'')}"></div>
        <div><label>job</label><input data-f="job" value="${esc(c.job||'')}"></div>
      </div>
      <div class="row">
        <button class="btn" onclick="saveChar('${c.id}')">💾 บันทึกค่าตัวละคร</button>
        <button class="btn ghost sm" onclick="toggleAdmin('${c.id}',${!d.profile?.is_admin})">${d.profile?.is_admin?'ถอนสิทธิ์ Admin':'ตั้งเป็น Admin'}</button>
        <span class="spacer"></span>
        <button class="btn bad sm" onclick="delChar('${c.id}','${esc(c.name||'')}')">🗑️ ลบตัวละคร</button>
      </div>

      <div class="subhead">เพิ่ม / ลบไอเทม</div>
      <div class="row">
        <input id="it-name" placeholder="ชื่อไอเทม เช่น Mythril Shard" style="flex:1;min-width:160px">
        <input id="it-type" placeholder="ประเภท" value="material" style="width:110px">
        <input id="it-qty" class="num" placeholder="จำนวน (+/-)" value="1" style="width:110px">
        <button class="btn" onclick="giveItem('${c.id}')">ยืนยัน</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:4px">ใส่จำนวนติดลบเพื่อลบออก (เช่น -5)</div>

      <div class="subhead">คลัง (${d.inventory.length})</div>
      <div class="tablewrap"><table><thead><tr><th>ไอเทม</th><th>ประเภท</th><th>จำนวน</th><th>stats</th></tr></thead>
        <tbody>${d.inventory.map(i=>`<tr><td>${esc(i.item_name)}</td><td class="muted">${esc(i.item_type)}</td><td class="num">${fmt(i.quantity)}</td><td class="muted mono" style="font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(JSON.stringify(i.stats||{}))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">ว่าง</td></tr>'}</tbody>
      </table></div>

      ${d.cards.length?`<div class="subhead">การ์ด (${d.cards.length})</div>
      <div class="tablewrap"><table><thead><tr><th>การ์ด</th><th>จำนวน</th><th>ดาว</th></tr></thead>
        <tbody>${d.cards.map(c=>`<tr><td>${esc(c.card_id)}</td><td class="num">${fmt(c.owned)}</td><td>${'★'.repeat(c.stars||1)}</td></tr>`).join('')}</tbody></table></div>`:''}
    </div>`;
  }catch(e){authGuard(e);m.innerHTML=`<div class="box"><button class="close" onclick="closeModal()">×</button><div class="err">${e.message}</div></div>`;}
};
window.closeModal=()=>{$('#modal').classList.add('hidden');$('#modal').innerHTML='';};

window.saveChar=async(cid)=>{
  const body={};document.querySelectorAll('#modal [data-f]').forEach(i=>{const v=i.value.trim();body[i.dataset.f]=/^[0-9-]+$/.test(v)?Number(v):v;});
  try{await api('/players/'+cid+'/character',{method:'POST',body:JSON.stringify(body)});toast('บันทึกค่าตัวละครแล้ว');openPlayer(cid);}
  catch(e){toast(e.message,false);}
};
window.giveItem=async(cid)=>{
  const item_name=$('#it-name').value.trim(),item_type=$('#it-type').value.trim()||'material',qty=Number($('#it-qty').value);
  if(!item_name)return toast('ใส่ชื่อไอเทม',false);
  try{await api('/players/'+cid+'/item',{method:'POST',body:JSON.stringify({item_name,item_type,qty})});toast('อัปเดตไอเทมแล้ว');openPlayer(cid);}
  catch(e){toast(e.message,false);}
};
window.toggleAdmin=async(cid,grant)=>{
  if(!confirm(grant?'ตั้งบัญชีนี้เป็น Admin?':'ถอนสิทธิ์ Admin?'))return;
  try{await api('/players/'+cid+'/admin-flag',{method:'POST',body:JSON.stringify({is_admin:grant})});toast('อัปเดตสิทธิ์แล้ว');openPlayer(cid);}
  catch(e){toast(e.message,false);}
};
window.delChar=async(cid,name)=>{
  if(!confirm('ลบตัวละคร "'+name+'" ถาวร? ลบแล้วกู้คืนไม่ได้'))return;
  try{await api('/players/'+cid+'/delete',{method:'POST'});toast('ลบตัวละครแล้ว');closeModal();renderPlayers();}
  catch(e){toast(e.message,false);}
};

// ---------- MOVEMENT (daily "stock ticker") ----------
const MOVE_META={
  gold:{label:'เงิน',cls:'gold'}, zol:{label:'ZOL',cls:'zol'},
  level:{label:'เลเวล',cls:''}, total_kills:{label:'คิล',cls:''},
  exp:{label:'EXP',cls:''}, play_time:{label:'เวลาเล่น',cls:''},
};
let moveMetric='gold', moveDays=7;
function deltaHtml(n){
  if(n>0)return `<span style="color:var(--good)">▲ +${fmt(n)}</span>`;
  if(n<0)return `<span style="color:var(--bad)">▼ ${fmt(Math.abs(n))}</span>`;
  return `<span class="muted">–</span>`;
}
function spark(vals){
  const clean=(vals||[]).filter(v=>Number.isFinite(v));
  if(clean.length<2)return '<span class="muted">–</span>';
  const w=96,h=26,min=Math.min(...clean),max=Math.max(...clean),rng=(max-min)||1;
  const pts=clean.map((v,i)=>`${((i/(clean.length-1))*w).toFixed(1)},${(h-((v-min)/rng)*(h-4)-2).toFixed(1)}`).join(' ');
  const up=clean[clean.length-1]>=clean[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle">
    <polyline fill="none" stroke="${up?'var(--good)':'var(--bad)'}" stroke-width="1.6" stroke-linejoin="round" points="${pts}"/></svg>`;
}
async function renderMovement(){
  const v=$('#view');
  v.innerHTML=`
    <div class="panel">
      <div class="row">
        <h2 style="margin:0">📈 การเปลี่ยนแปลงรายวัน (แบบหุ้น)</h2>
        <span class="spacer"></span>
        <select id="mv-metric">${Object.entries(MOVE_META).map(([k,m])=>`<option value="${k}" ${k===moveMetric?'selected':''}>${m.label}</option>`).join('')}</select>
        <select id="mv-days">${[7,14,30].map(d=>`<option value="${d}" ${d===moveDays?'selected':''}>${d} วัน</option>`).join('')}</select>
        <button class="btn ghost sm" onclick="renderMovement()">รีเฟรช</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px">“วันนี้” = ค่าปัจจุบัน − ค่าตอนต้นวัน (เหมือนราคาหุ้นวิ่งระหว่างวัน) · เส้นกราฟ = ${moveDays} วันล่าสุด</div>
    </div>
    <div id="mv-body"><div class="muted">กำลังโหลด...</div></div>`;
  $('#mv-metric').onchange=e=>{moveMetric=e.target.value;renderMovement();};
  $('#mv-days').onchange=e=>{moveDays=Number(e.target.value);renderMovement();};
  try{
    const d=await api(`/movement?metric=${moveMetric}&days=${moveDays}&limit=300`);
    const meta=MOVE_META[moveMetric], t=d.totals;
    const rows=d.players.map((p,i)=>{
      const hist=(d.history[p.characterId]||[]).map(h=>Number(h[moveMetric]));
      const series=[...hist, p.current[moveMetric]];
      return `<tr class="clickable" onclick="openPlayer('${p.characterId}')">
        <td class="muted">${i+1}</td>
        <td><b>${esc(p.name||'-')}</b> ${p.hasBaseline?'':'<span class="chip off" title="ยังไม่มีค่าตั้งต้นวันนี้">ใหม่</span>'}</td>
        <td class="num ${meta.cls}">${fmt(p.current[moveMetric])}</td>
        <td class="num">${deltaHtml(p.today[moveMetric])}</td>
        <td>${spark(series)}</td>
        <td class="num muted">${deltaHtml(p.today.level)}</td>
        <td class="num muted">${deltaHtml(p.today.gold)}</td>
        <td class="num muted">${deltaHtml(p.today.total_kills)}</td>
      </tr>`;
    }).join('');
    $('#mv-body').innerHTML=`
      <div class="grid cards" style="margin-bottom:16px">
        ${stat('ผู้เล่นที่ขยับวันนี้',`<span style="color:var(--good)">${fmt(t.activePlayers)}</span>`)}
        ${stat(meta.label+'รวมที่เพิ่มวันนี้',`<span class="${meta.cls}">${t[moveMetric]>=0?'+':''}${fmt(t[moveMetric])}</span>`,'small')}
        ${stat('เงินรวมวันนี้',`<span class="gold">${t.gold>=0?'+':''}${fmt(t.gold)}</span>`,'small')}
        ${stat('คิลรวมวันนี้',`${t.total_kills>=0?'+':''}${fmt(t.total_kills)}`,'small')}
      </div>
      <div class="panel"><div class="tablewrap"><table>
        <thead><tr>
          <th>#</th><th>ชื่อ</th><th>${meta.label} ปัจจุบัน</th><th>วันนี้ (${meta.label})</th>
          <th>${moveDays} วัน</th><th>Δเลเวล</th><th>Δเงิน</th><th>Δคิล</th>
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="8" class="muted">ยังไม่มีข้อมูล — ระบบจะเก็บภาพรวมรายวันตั้งแต่วันนี้เป็นต้นไป</td></tr>'}</tbody>
      </table></div></div>`;
  }catch(e){authGuard(e);$('#mv-body').innerHTML=`<div class="err">${e.message}</div>`;}
}

            <tr>
              <td>${m.emoji||''} <b>${esc(m.name)}</b> ${m.is_boss?'<span class="pill bad">BOSS</span>':''} <span class="muted mono">${m.type}</span></td>

              <td class="num">${fmt(m.hp)}</td><td class="num">${fmt(m.atk)}</td><td class="num">${fmt(m.def)}</td><td class="num">${fmt(m.exp)}</td>
              <td class="gold">${m.gold_min}-${m.gold_max}</td>

  try{
    const d=await api('/maps/'+monMap+'/spawns');
    const opts=monCatalog.map(m=>`<option value="${m.type}">${m.emoji||''} ${esc(m.name)} (${m.environment})</option>`).join('');
    box.innerHTML=`
      <div class="row" style="margin:10px 0;align-items:center;gap:8px">
        <label>จำนวนบก <input id="mon-land" type="number" min="0" max="60" value="${d.landCount}" style="width:72px"></label>
        <label>จำนวนน้ำ <input id="mon-water" type="number" min="0" max="30" value="${d.waterCount}" style="width:72px"></label>
        <button class="btn sm" onclick="saveMapConfig()">บันทึกจำนวน</button>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>มอนสเตอร์</th><th>โซน</th><th class="num">น้ำหนักสุ่ม</th><th></th></tr></thead>
        <tbody>${d.spawns.length?d.spawns.map(s=>`
          <tr>
            <td>${s.emoji||''} <b>${esc(s.name||s.monster_type)}</b> <span class="muted mono">${s.monster_type}</span></td>
            <td>${s.is_water?'💧 น้ำ':'🌿 บก'}</td>
            <td class="num"><input type="number" min="1" max="1000" value="${s.weight}" style="width:80px" onchange="saveWeight('${s.monster_type}',this.value,${s.is_water})"></td>
            <td><button class="btn ghost sm bad" onclick="delSpawn(${s.id})">ลบ</button></td>
          </tr>`).join(''):'<tr><td colspan="4" class="muted">ยังไม่มีมอนสเตอร์ในแผนที่นี้</td></tr>'}</tbody>
      </table></div>
      <div class="row" style="margin-top:12px;gap:8px;align-items:center">
        <select id="mon-add-type">${opts}</select>
        <label>น้ำหนัก <input id="mon-add-w" type="number" min="1" max="1000" value="20" style="width:80px"></label>
        <button class="btn sm" onclick="addSpawn()">➕ เพิ่มลงแผนที่</button>
      </div>`;
  }catch(e){authGuard(e);box.innerHTML=`<div class="err">${e.message}</div>`;}
}
window.saveMapConfig=async()=>{
  try{await api('/maps/'+monMap+'/config',{method:'PUT',body:JSON.stringify({land_count:Number($('#mon-land').value),water_count:Number($('#mon-water').value)})});
    toast('บันทึกจำนวนแล้ว');}catch(e){toast(e.message,false);}
};
window.saveWeight=async(type,w,isWater)=>{
  try{await api('/maps/'+monMap+'/spawns',{method:'POST',body:JSON.stringify({monster_type:type,weight:Number(w),is_water:isWater})});toast('อัปเดตน้ำหนักแล้ว');}catch(e){toast(e.message,false);loadMapSpawns();}
};
window.addSpawn=async()=>{
  try{await api('/maps/'+monMap+'/spawns',{method:'POST',body:JSON.stringify({monster_type:$('#mon-add-type').value,weight:Number($('#mon-add-w').value)})});toast('เพิ่มแล้ว');loadMapSpawns();}catch(e){toast(e.message,false);}
};
window.delSpawn=async(id)=>{
  if(!confirm('ลบมอนสเตอร์นี้ออกจากแผนที่?'))return;
  try{await api('/spawns/'+id,{method:'DELETE'});toast('ลบแล้ว');loadMapSpawns();}catch(e){toast(e.message,false);}
};
window.openMonster=async(type)=>{
  const m=$('#modal');m.classList.remove('hidden');m.innerHTML='<div class="box"><div class="muted">กำลังโหลด...</div></div>';
  try{
    const def=monCatalog.find(x=>x.type===type)||{};
    const {drops}=await api('/monsters/'+type+'/drops');

    m.innerHTML=`<div class="box">
      <div class="modal-head"><h2>${def.emoji||''} ${esc(def.name||type)} <span class="muted mono">${type}</span></h2><button class="btn ghost sm" onclick="closeModal()">ปิด</button></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px">
        <label class="fld"><span>ชื่อ</span><input data-mf="name" value="${esc(def.name||'')}"></label>
        <label class="fld"><span>Emoji</span><input data-mf="emoji" value="${esc(def.emoji||'')}"></label>
        ${f('HP','hp',def.hp)}${f('ATK','atk',def.atk)}${f('DEF','def',def.def)}${f('EXP','exp',def.exp)}
        ${f('Gold min','gold_min',def.gold_min)}${f('Gold max','gold_max',def.gold_max)}

        <label class="fld"><span>บอส</span><select data-mf="is_boss"><option value="false" ${!def.is_boss?'selected':''}>ไม่</option><option value="true" ${def.is_boss?'selected':''}>ใช่</option></select></label>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="saveMonster('${type}')">💾 บันทึกสตัท</button></div>
      <h2 style="margin-top:18px">🎁 ตารางดรอป</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>ไอเทม</th><th>ประเภท</th><th class="num">โอกาส</th><th class="num">จำนวน</th><th></th></tr></thead>
        <tbody id="mon-drops">${dropRows(drops)}</tbody>
      </table></div>
      <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap;align-items:center">
        <input id="dp-name" placeholder="ชื่อไอเทม" style="min-width:140px">
        <input id="dp-emoji" placeholder="emoji" style="width:70px">
        <input id="dp-type" placeholder="ประเภท" value="material" style="width:100px">
        <label>% <input id="dp-chance" type="number" min="0" max="100" value="10" style="width:70px"></label>
        <label>จำนวน <input id="dp-qmin" type="number" min="1" value="1" style="width:56px"> - <input id="dp-qmax" type="number" min="1" value="1" style="width:56px"></label>
        <button class="btn sm" onclick="addDrop('${type}')">➕ เพิ่มดรอป</button>
      </div>
    </div>`;
  }catch(e){m.innerHTML=`<div class="box"><div class="err">${e.message}</div><button class="btn ghost sm" onclick="closeModal()">ปิด</button></div>`;}
};
function dropRows(drops){
  return drops.length?drops.map(d=>`<tr>
    <td>${d.emoji||''} ${esc(d.item_name)}</td><td>${esc(d.item_type)}</td>
    <td class="num">${(d.chance*100).toFixed(1)}%</td><td class="num">${d.qty_min===d.qty_max?d.qty_min:d.qty_min+'-'+d.qty_max}</td>
    <td><button class="btn ghost sm bad" onclick="delDrop(${d.id},'${d.monster_type}')">ลบ</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">ยังไม่มีดรอป</td></tr>';
}
window.saveMonster=async(type)=>{
  const body={};document.querySelectorAll('#modal [data-mf]').forEach(i=>{
    let val=i.value;
    if(i.dataset.mf==='is_boss')val=(val==='true');
    else if(!['name','emoji'].includes(i.dataset.mf))val=Number(val);
    body[i.dataset.mf]=val;
  });
  try{await api('/monsters/'+type,{method:'PATCH',body:JSON.stringify(body)});toast('บันทึกสตัทแล้ว');renderMonsters();closeModal();}catch(e){toast(e.message,false);}
};
window.addDrop=async(type)=>{
  const body={item_name:$('#dp-name').value.trim(),emoji:$('#dp-emoji').value.trim(),item_type:$('#dp-type').value.trim()||'material',
    chance:Number($('#dp-chance').value)/100,qty_min:Number($('#dp-qmin').value),qty_max:Number($('#dp-qmax').value)};
  if(!body.item_name){toast('ใส่ชื่อไอเทม',false);return;}
  try{await api('/monsters/'+type+'/drops',{method:'POST',body:JSON.stringify(body)});toast('เพิ่มดรอปแล้ว');openMonster(type);}catch(e){toast(e.message,false);}
};
window.delDrop=async(id,type)=>{
  try{await api('/drops/'+id,{method:'DELETE'});toast('ลบดรอปแล้ว');openMonster(type);}catch(e){toast(e.message,false);}
};

            <td class="num" style="color:${x.suspicious?'var(--bad)':'inherit'}">${x.suspicious}</td>
            <td class="muted">${x.usernames.map(esc).join(', ')||'-'}</td>
            <td class="muted">${ago(x.lastSeen)}</td>
          </tr>`).join('')||'<tr><td colspan="9" class="muted">ยังไม่มีข้อมูล</td></tr>'}</tbody>
        </table></div></div>

        <div class="panel"><h2>🟢 ออนไลน์ตอนนี้ (${d.online.length})</h2><div class="tablewrap"><table>
          <thead><tr><th>ชื่อ</th><th>Lv</th><th>IP</th><th>แผนที่</th><th>ping</th><th>ยืนยัน</th><th>เข้าเมื่อ</th><th></th></tr></thead>
          <tbody>${d.online.map(p=>`<tr>
            <td><b>${esc(p.username)}</b> ${p.isAdmin?'<span class="chip admin">A</span>':''}</td>
            <td class="num">${p.level}</td><td class="mono">${esc(p.ip)}</td><td class="muted">${esc(p.mapId||'-')}</td>
            <td class="num">${p.ping??'-'}</td><td>${p.verified?'✓':'<span style="color:var(--warn)">?</span>'}</td>
            <td class="muted">${ago(p.joinedAt)}</td>
            <td><button class="btn warn sm" onclick="kick('${p.userId}')">เตะออก</button></td>
          </tr>`).join('')||'<tr><td colspan="8" class="muted">ไม่มีใครออนไลน์</td></tr>'}</tbody>
        </table></div></div>

        <div class="panel"><h2>📜 เหตุการณ์ล่าสุด</h2><div class="tablewrap"><table>
          <thead><tr><th>เมื่อ</th><th>ชนิด</th><th>IP</th><th>รายละเอียด</th></tr></thead>
          <tbody>${d.events.map(e=>`<tr><td class="muted">${ago(e.ts)}</td><td><span class="chip ${e.kind==='suspicious'?'off':''}" style="${e.kind==='suspicious'?'color:var(--bad)':e.kind==='auth_fail'?'color:var(--warn)':''}">${e.kind}</span></td><td class="mono">${esc(e.ip)}</td><td class="muted">${esc(e.detail||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">ยังไม่มี</td></tr>'}</tbody>
        </table></div></div>`;
      if(cur==='security')secTimer=setTimeout(load,8000); // auto-refresh
    }catch(e){authGuard(e);$('#sec-body').innerHTML=`<div class="err">${e.message}</div>`;}
  };
  load();
}
window.kick=async(userId)=>{
  if(!confirm('เตะผู้เล่นนี้ออกจากเกม?'))return;
  try{await api('/kick',{method:'POST',body:JSON.stringify({userId})});toast('เตะออกแล้ว');}
  catch(e){toast(e.message,false);}
};
window.scanCheats=async()=>{
  try{const r=await api('/cheats/scan',{method:'POST'});toast((r.reset||r.flagged)?`รีเซต ${r.reset} · ปักธงน่าสงสัย ${r.flagged}`:'ไม่พบบัญชีโกงเพิ่ม ✅');if(cur==='security')renderSecurity();}
  catch(e){toast(e.message,false);}
};
window.resetChar=async(cid,name)=>{
  if(!confirm('รีเซตตัวละคร "'+name+'" กลับเป็นค่าเริ่มต้น (Lv1)? เก็บบัญชีไว้แต่ล้างค่าโกง'))return;
  try{await api('/players/'+cid+'/reset',{method:'POST'});toast('รีเซตแล้ว');renderSecurity();}
  catch(e){toast(e.message,false);}
};
window.delCheat=async(cid,name)=>{
  if(!confirm('ลบตัวละคร "'+name+'" ถาวร? (ระบบรีเซตค่าให้แล้ว การลบจะกู้คืนไม่ได้)'))return;
  try{await api('/players/'+cid+'/delete',{method:'POST'});toast('ลบตัวละครแล้ว');renderSecurity();}
  catch(e){toast(e.message,false);}
};

// ---------- EVENTS ----------
function renderEvents(){
  const v=$('#view');
  v.innerHTML=`
    <div class="panel">
      <h2>📢 ส่งประกาศทั้งเซิร์ฟเวอร์</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="ann-text" placeholder="ข้อความประกาศถึงผู้เล่นทุกคน..." style="flex:1;min-width:220px">
        <input id="ann-color" type="color" value="#ffd24a" style="width:52px;padding:2px;height:38px">
        <button class="btn" onclick="sendAnnounce()">ส่งประกาศ</button>
      </div>
      <div class="row">
        <button class="btn ghost sm" onclick="preset('🎉 กิจกรรมพิเศษเริ่มแล้ว! ล่ามอนสเตอร์รับ EXP x2')">EXP x2</button>
        <button class="btn ghost sm" onclick="preset('⚔️ บอสโลกกำลังจะปรากฏ! เตรียมตัวให้พร้อม')">บอสโลก</button>
        <button class="btn ghost sm" onclick="preset('🛠️ ระบบจะปิดปรับปรุงชั่วคราว กรุณาบันทึกความคืบหน้า')">แจ้งปิดปรับปรุง</button>
        <button class="btn ghost sm" onclick="preset('🎁 แจกของรางวัลประจำวัน อย่าลืมล็อกอินรับ!')">แจกรางวัล</button>
      </div>
    </div>
    <div class="panel muted" style="font-size:13px">
      ประกาศจะเด้งขึ้นบนหน้าจอผู้เล่นทุกคนที่กำลังออนไลน์ทันที (ผ่านระบบ realtime)
    </div>`;
}
window.preset=(t)=>{$('#ann-text').value=t;};
window.sendAnnounce=async()=>{
  const text=$('#ann-text').value.trim(),color=$('#ann-color').value;
  if(!text)return toast('ใส่ข้อความก่อน',false);
  try{await api('/announce',{method:'POST',body:JSON.stringify({text,color})});toast('ส่งประกาศแล้ว');$('#ann-text').value='';}
  catch(e){toast(e.message,false);}
};

// ---------- utils ----------
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function authGuard(e){if(/401|เข้าสู่ระบบ|ผู้ดูแล|403/.test(e.message)){toast('เซสชันหมดอายุ',false);setTimeout(()=>{localStorage.removeItem(TK);location.reload();},1200);}}

// ---------- boot ----------
(async()=>{
  if(token){try{const chk=await api('/me');me=chk.admin;enterApp();}catch{localStorage.removeItem(TK);token=null;}}
})();
</script>
</body>
</html>
