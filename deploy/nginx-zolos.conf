# Nginx reverse proxy for the Zolos Map Server (Socket.io) — game.zolos.online
#
# Terminates TLS and forwards to the Node server on 127.0.0.1:3001, upgrading
# the connection to WebSocket so the browser can reach it over wss:// from the
# https frontend (Vercel). Install to /etc/nginx/sites-available/zolos and
# symlink into sites-enabled; certbot --nginx rewrites this into the 443 block
# and adds the HTTP->HTTPS redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name game.zolos.online;

    # Socket.io handshake + upgrade all go through the same location.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client info for CORS origin checks + logging
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets: don't cut idle connections early.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
